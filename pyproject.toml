[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wear-pkg"
version = "0.1.0"
description = "Leakage-safe temporal replay and ranking for Wear-PKG"
requires-python = ">=3.11"

[project.scripts]
wear-pkg = "wear_pkg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
